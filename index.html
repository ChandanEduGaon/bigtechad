<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="./logo.png" type="image/x-icon" />
    <title>Live Recovery with Hazariwin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
        background-image: url("./banner.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        position: relative;
        overflow: hidden;
      }
      @media only screen and (min-width: 400px) {
        .container {
          background-size: contain;
          background-position: center;
        }
      }

      .content {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        /* background-color: #000000c8; */
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 30px;
        color: #fff;
        text-transform: uppercase;
        overflow: hidden;
      }
      a {
        text-decoration: none;
        padding: 18px 35px;
        background-color: #cd0682;
        border-radius: 100px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
        box-shadow: 5px 5px 15px #cd0682;
        animation: move 1s linear infinite;
        position: relative;
      }
      a.x::before {
        content: "";
        width: 0px;
        height: 0px;
        border: 5px solid #008cff;
        border-radius: 100px;
        position: absolute;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        animation: ripple 1s linear infinite;
        filter: drop-shadow(0 0 10px #008cff, 0 10px #008cff);
      }

      @keyframes move {
        0% {
          box-shadow: 5px 5px 15px #008cff;
        }
        50% {
          box-shadow: 5px 5px 25px #008cff;
        }
        50% {
          box-shadow: 5px 5px 35px #008cff;
        }
        100% {
          box-shadow: 5px 5px 15px #008cff;
        }
      }
      @keyframes ripple {
        0% {
          width: 0px;
          height: 0px;
          opacity: 1;
        }
        50% {
          width: 60px;
          height: 60px;
        }
        50% {
          width: 120px;
          height: 120px;
        }
        100% {
          opacity: 0;
          width: 250px;
          height: 250px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <a href="https://t.me/recovery_with_hw" style="margin-top: 100px;">WINGO 1MIN</a>
        <a class="x" href="https://t.me/recovery_with_hw"
          >SUBSCRIBE FOR FREE</a
        >
      </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
      function generateFingerprint() {
        const userAgent = navigator.userAgent;
        const screenWidth = screen.width;
        const screenHeight = screen.height;
        const colorDepth = screen.colorDepth;
        const timezoneOffset = new Date().getTimezoneOffset();

        // Combine properties to generate a unique fingerprint
        const fingerprintData = `${userAgent}-${screenWidth}x${screenHeight}-${colorDepth}-${timezoneOffset}`;

        // Generate a hash of the fingerprint
        return hashCode(fingerprintData);
      }

      function getDeviceName() {
        const userAgent = navigator.userAgent;

        if (/Android/i.test(userAgent)) {
          return "Android Device";
        } else if (/iPhone|iPad|iPod/i.test(userAgent)) {
          return "iOS Device";
        } else if (/Windows NT/i.test(userAgent)) {
          return "Windows PC";
        } else if (/Mac OS X/i.test(userAgent)) {
          return "Mac Device";
        } else {
          return "Unknown Device";
        }
      }

      // Simple hash function
      function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash);
      }

      $(document).ready(function () {
        $.ajax({
          type: "POST",
          url: "https://hazariwin.ctapi.site/api/user/saveClicks",
          data: {
            clicked: "1",
            device: getDeviceName(),
            fingerprint: generateFingerprint(),
          },
          dataType: "json",
          success: function (response) {},
        });
      });
    </script>
  </body>
</html>
